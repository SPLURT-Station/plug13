# Build image → push to GHCR → trigger Dokploy Docker Compose redeploy.
# Dokploy: copy the Compose webhook from Deployments tab (e.g. .../api/deploy/compose/<id>).
# Docs: https://docs.dokploy.com/docs/core/auto-deploy

name: Docker build & Dokploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-dokploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push-trigger:
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: GHCR image name (lowercase)
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy Compose deployment
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_COMPOSE_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::notice::Secret DOKPLOY_COMPOSE_WEBHOOK_URL is not set — image was pushed, but Dokploy was not triggered."
            exit 0
          fi
          echo "Calling Dokploy compose webhook..."
          # Dokploy exposes per-compose webhook URLs (Deployments tab). POST is typical.
          if ! curl -fsS -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "{}"; then
            echo "Retrying POST without JSON body..."
            curl -fsS -X POST "$WEBHOOK_URL"
          fi
          echo "Dokploy trigger request finished."

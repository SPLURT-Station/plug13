# Deploy Plug13 with Docker Compose.
#
# 1. Copy .env.example → .env and set real values (secrets, DB URLs, public origin).
# 2. Optional: override any variable below under `environment` (inline or ${VAR} from shell).
# 3. Run: docker compose up -d --build
#
# Image: omit `build` and set `image:` to e.g. ghcr.io/splurt-station/plug13:latest for registry deploys.

name: plug13

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: plug13:local
    restart: unless-stopped
    ports:
      - "${PLUG13_HTTP_PORT:-3000}:3000"
    env_file:
      # Primary: all keys from .env.example — copy to `.env` and edit.
      - .env
    environment:
      # Required inside Docker so the published port works
      HOST: "0.0.0.0"
      PORT: "3000"

      # --- Same keys as .env.example (values from `.env` unless you override here) ---
      NUXT_JWT_SECRET: ${NUXT_JWT_SECRET}
      NUXT_BYOND_SECRET: ${NUXT_BYOND_SECRET}
      NUXT_DISCORD_CLIENT_SECRET: ${NUXT_DISCORD_CLIENT_SECRET}
      NUXT_PUBLIC_DISCORD_CLIENT_ID: ${NUXT_PUBLIC_DISCORD_CLIENT_ID}
      NUXT_PUBLIC_ORIGIN: ${NUXT_PUBLIC_ORIGIN}
      DATABASE_PRISMA_URL: ${DATABASE_PRISMA_URL}

      # Examples of manual overrides (uncomment and set, or use extra env files):
      # NUXT_PUBLIC_ORIGIN: "https://plug13.example.com"
      # NUXT_JWT_SECRET: "your-secret-here"
